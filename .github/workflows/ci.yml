name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      # Classified by the repository-owned shell classifier (Issue #137):
      #   docs — git diff --check only
      #   normal — typecheck / lint / test / build
      #   core — normal gates plus the 375px Japanese Golden-path E2E
      risk: ${{ steps.classify.outputs.risk }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Fetch the full history (including the merge base with the target
          # branch) so the classifier can diff exactly the PR's changed files
          # on both `pull_request` and `push` to `main`.
          fetch-depth: 0

      - name: Resolve base ref
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: git diff --check
        run: git diff --check "$BASE" "$GITHUB_SHA"

      - name: Classify changes
        id: classify
        run: |
          risk="$(git diff --name-only "$BASE" "$GITHUB_SHA" | bash scripts/ci/classify-changes.sh)"
          echo "risk=$risk" >> "$GITHUB_OUTPUT"
          echo "Classified change risk: $risk"
        env:
          BASE: ${{ steps.base.outputs.base }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Runtime gates only when the change is not docs/policy-only.
      - name: Install dependencies
        if: steps.classify.outputs.risk != 'docs'
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        if: steps.classify.outputs.risk != 'docs'
        run: pnpm typecheck

      - name: Lint
        if: steps.classify.outputs.risk != 'docs'
        run: pnpm lint

      - name: Test
        if: steps.classify.outputs.risk != 'docs'
        run: pnpm test

      - name: Build
        if: steps.classify.outputs.risk != 'docs'
        run: pnpm build

  golden-path-e2e:
    name: Golden-path E2E (375px, ja)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Runs only for core-risk changes, after Quality Gates classifies the change
    # and proves the normal runtime gates pass.
    needs: quality-gates
    if: needs.quality-gates.outputs.risk == 'core'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # E2E builds the Vite production bundle it needs but does not rerun the
      # TypeScript typecheck that Quality Gates already owns (Issue #137).
      - name: Build
        run: pnpm build

      - name: Run golden-path E2E
        run: npx playwright test
