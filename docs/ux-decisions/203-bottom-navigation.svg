<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP","Noto Sans TC",sans-serif;fill:#263228}
    .title{font-size:34px;font-weight:700}.sub{font-size:18px;fill:#556057}.h{font-size:22px;font-weight:700}.body{font-size:17px}.small{font-size:15px;fill:#5f6b62}.tab{font-size:17px;font-weight:650}.opt{font-size:18px;font-weight:700}
  </style>
  <rect width="1200" height="720" fill="#F7F6EF"/>
  <text x="56" y="66" class="title">#203 Bottom Navigation Decision</text>
  <text x="56" y="98" class="sub">ボトムナビの役割・名称 / 底部導覽語意與命名</text>

  <rect x="56" y="132" width="520" height="210" rx="22" fill="#FFFFFF" stroke="#D9DDD6"/>
  <text x="82" y="168" class="h">Current Figma</text>
  <text x="82" y="198" class="small">node 3:1952</text>
  <rect x="82" y="226" width="468" height="74" rx="18" fill="#EDF3E3"/>
  <text x="105" y="270" class="tab">食旅を見つけ　 モグモグる　 お気に入り　 マイ</text>

  <rect x="624" y="132" width="520" height="210" rx="22" fill="#FFFFFF" stroke="#D9DDD6"/>
  <text x="650" y="168" class="h">Current Product contract (#92)</text>
  <text x="650" y="198" class="small">persistent primary navigation</text>
  <rect x="650" y="226" width="468" height="74" rx="18" fill="#F2EFE8"/>
  <text x="682" y="270" class="tab">Home　 Discover　 MOGU　 My</text>

  <path d="M576 236 C600 236 600 236 624 236" stroke="#8A968C" stroke-width="3" fill="none"/>
  <path d="M610 226 L624 236 L610 246" fill="#8A968C"/>
  <text x="516" y="322" class="small">label mapping or IA change?</text>

  <text x="56" y="398" class="h">Team decision options / 選択肢</text>
  <rect x="56" y="426" width="340" height="188" rx="20" fill="#FFFFFF" stroke="#D9DDD6"/>
  <text x="80" y="464" class="opt">A. Keep IA</text>
  <text x="80" y="496" class="body">Figma = user-facing labels only</text>
  <text x="80" y="528" class="small">低リスク / 低風險</text>
  <text x="80" y="556" class="small">但可能失去 KiKi 的新 IA 意圖</text>

  <rect x="430" y="426" width="340" height="188" rx="20" fill="#FFFFFF" stroke="#D9DDD6"/>
  <text x="454" y="464" class="opt">B. Adopt Figma IA</text>
  <text x="454" y="496" class="body">4 tabs become new product surfaces</text>
  <text x="454" y="528" class="small">設計意圖最完整</text>
  <text x="454" y="556" class="small">需重做 routing / persistence semantics</text>

  <rect x="804" y="426" width="340" height="188" rx="20" fill="#EAF2DD" stroke="#9EAF88" stroke-width="2"/>
  <text x="828" y="464" class="opt">C. Hybrid ★</text>
  <text x="828" y="496" class="body">travel-first labels + stable semantics</text>
  <text x="828" y="528" class="small">例: 食旅を見つけ / 探す / MOGU / マイ</text>
  <text x="828" y="556" class="small">8/23 に最も reversible</text>

  <text x="56" y="664" class="body">Decide: canonical role of each tab → Japanese label → EN / zh-TW meaning → update Figma + #92.</text>
  <text x="56" y="694" class="small">決めるもの：每個 tab 的正式角色、顯示名稱與多語系語意。不是單純「哪個字比較好看」。</text>
</svg>